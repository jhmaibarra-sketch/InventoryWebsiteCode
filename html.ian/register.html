<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Register</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#f4f6f9; margin:0; padding:0; }
    header { background:#2c3e50; color:#fff; padding:20px; text-align:center; }
    .container { max-width:600px; margin:50px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    label { font-weight:bold; display:block; margin-top:10px; }
    input { padding:8px; width:100%; border:1px solid #ccc; border-radius:4px; margin-top:5px; }
    button { padding:10px 15px; border:none; border-radius:4px; cursor:pointer; font-weight:500; margin-top:15px; background:#27ae60; color:#fff; }
  </style>
</head>
<body>
  <header>
    <h2>Inventory Register</h2>
  </header>

  <div class="container">
    <form action="login.html" method="post">
      <label>Enter Student ID To Register(Format: 02-2526-######):</label>
      <input type="text" name="studentID" placeholder="02-2526-123456" required>
      <button type="submit">Register</button>
    </form>
    <p><em>After registering, proceed to login.</em></p>
  </div>
</body>
</html>
